name: Update nextflow.config on Dependabot Docker PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'env/**/Dockerfile'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nextflow-config:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR HEAD safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Fetch base branch for comparison
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Parse image & version from Dockerfile
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED_DOCKERFILES=$(git diff --name-only --diff-filter=AM "$BASE_REF" HEAD -- "env/*/Dockerfile" | grep -E '^env/[^/]+/Dockerfile$' || true)
          
          if [[ -z "$CHANGED_DOCKERFILES" ]]; then
            echo "No Dockerfile changes detected in env/*/Dockerfile"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          
          DOCKERFILE=$(echo "$CHANGED_DOCKERFILES" | head -n1)
          
          if [[ ! -f "$DOCKERFILE" ]]; then
            echo "Dockerfile $DOCKERFILE not found in working tree"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          
          DIR_NAME=$(dirname "$DOCKERFILE" | sed 's|^env/||')
          echo "Processing Dockerfile: $DOCKERFILE (directory: $DIR_NAME)"

          FULL_IMAGE="$(awk '/^FROM[[:space:]]+/ {print $2; exit}' "$DOCKERFILE")"
          if [[ -z "${FULL_IMAGE:-}" ]]; then
            echo "Could not parse FROM line in $DOCKERFILE"; exit 1
          fi

          IMAGE_BASE="${FULL_IMAGE%%:*}"
          NEW_TAG="${FULL_IMAGE#*:}"

          echo "dockerfile_path=$DOCKERFILE" >>"$GITHUB_OUTPUT"
          echo "image_base=$IMAGE_BASE" >>"$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"
          
          echo "Found Docker image: $IMAGE_BASE:$NEW_TAG"

      - name: Update nextflow.config
        if: steps.parse.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="nextflow.config"
          IMAGE_BASE="${{ steps.parse.outputs.image_base }}"
          NEW_TAG="${{ steps.parse.outputs.new_tag }}"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Missing $CONFIG_FILE"; exit 1
          fi

          BEFORE_HASH="$(sha256sum "$CONFIG_FILE" | awk '{print $1}')"

          echo "Updating container references for $IMAGE_BASE:$NEW_TAG"

          sed -i -E "s|(container[[:space:]]*=[[:space:]]*['\"])${IMAGE_BASE}:[^'\"]*(['\"])|\1${IMAGE_BASE}:${NEW_TAG}\2|g" "$CONFIG_FILE"
          sed -i -E "s|(process\.container[[:space:]]*=[[:space:]]*['\"])${IMAGE_BASE}:[^'\"]*(['\"])|\1${IMAGE_BASE}:${NEW_TAG}\2|g" "$CONFIG_FILE"
          
          sed -i -E "s|(container[[:space:]]*=[[:space:]]*['\"])docker://${IMAGE_BASE}:[^'\"]*(['\"])|\1docker://${IMAGE_BASE}:${NEW_TAG}\2|g" "$CONFIG_FILE"
          sed -i -E "s|(process\.container[[:space:]]*=[[:space:]]*['\"])docker://${IMAGE_BASE}:[^'\"]*(['\"])|\1docker://${IMAGE_BASE}:${NEW_TAG}\2|g" "$CONFIG_FILE"

          sed -i -E "s|(${IMAGE_BASE}:)[0-9A-Za-z._-]+|\1${NEW_TAG}|g" "$CONFIG_FILE"

          AFTER_HASH="$(sha256sum "$CONFIG_FILE" | awk '{print $1}')"

          if [[ "$BEFORE_HASH" == "$AFTER_HASH" ]]; then
            echo "No container reference to update in $CONFIG_FILE for base ${IMAGE_BASE}."
            echo "Likely the image is referenced elsewhere or via a param; skipping commit."
            exit 0
          fi

          echo "=== Changes made to $CONFIG_FILE ==="
          git --no-pager diff -- "$CONFIG_FILE" || true

      - name: Commit & push back to PR branch
        if: steps.parse.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- nextflow.config; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nextflow.config
          git commit -m "chore(nextflow): sync container tag with Dockerfile

          - Updated ${{ steps.parse.outputs.image_base }} to version ${{ steps.parse.outputs.new_tag }}
          - Auto-generated by dependabot workflow
          - Commit: ${GITHUB_SHA::7}"

          PR_HEAD="${{ github.event.pull_request.head.ref }}"
          REPO="${{ github.repository }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git" "HEAD:${PR_HEAD}"

      - name: Comment on PR
        if: steps.parse.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Automated Update**: Updated `nextflow.config` to use the new Docker image version from the Dockerfile.'
            })